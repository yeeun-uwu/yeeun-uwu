name: Update README cards

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=material-palenight
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=material-palenight&hide=Jupyter%20Notebook
          path: profile/top-langs.svg
          token: ${{ secrets.GH_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update README cards"
          git push
